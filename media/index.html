<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gtags Code View</title>
<link rel="stylesheet" href="treeview.css" />
<script src="d3.js"></script>
<script src="d3-flextree.js"></script>
<script src="treeview.js"></script>
<style>
  :root {
    --bg: #1e1e1e;
    --panel: #252526;
    --panel-hover: #2a2d2e;
    --border: #3a3a3a;
    --text: #cccccc;
    --muted: #858585;
    --accent: #007acc;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .app {
    width: 100vw;
    height: 100vh;
    display: flex;
  }

  /* Left vertical tab bar */
  .sidebar {
    width: 180px;
    min-width: 80px;
    height: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--panel);
    border-right: 1px solid #2b2b2b;
    padding: 4px 0;
  }

  .sidebar-resizer {
    position: absolute;
    top: 0;
    right: -3px;
    width: 3px;
    height: 100%;
    cursor: col-resize;
    z-index: 10;
  }

  .sidebar-resizer:hover,
  .sidebar-resizer.dragging {
    background: var(--accent);
    opacity: 0.55;
  }

  .tabs {
    width: 100%;
    flex: 1;
    overflow-y: auto;
    scrollbar-width: none;
  }

  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    position: relative;
    width: 100%;
    min-height: 42px;
    padding: 0 20px 0 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid #292929;
    transition: background 0.12s, color 0.12s;
  }

  .tab:hover {
    background: var(--panel-hover);
    color: var(--text);
  }

  .tab.active {
    color: #ffffff;
    background: #303031;
  }

  .tab.active::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--accent);
  }

  .tab-label {
    font-size: 11px;
    letter-spacing: 0.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  .close-tab {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    display: none;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 3px;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
  }

  .tab:hover .close-tab {
    display: flex;
  }

  .close-tab:hover {
    background: #444444;
    color: #ffffff;
  }

  /* Workspace area */
  .workspace {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .toolbar {
    height: 36px;
    min-height: 36px;
    display: flex;
    align-items: center;
    padding: 0 14px;
    border-bottom: 1px solid #2b2b2b;
    background: var(--panel);
    font-size: 12px;
  }

  .plot-title {
    font-weight: 500;
  }

  .tab-container {
    position: relative;
    flex: 1;
    min-height: 0;
    background: var(--bg);
  }

  .empty-state {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    font-size: 13px;
  }
</style>
</head>

<body>
<div class="app">
  <aside id="sidebar" class="sidebar">
    <div id="sidebarResizer" class="sidebar-resizer" title="Drag to resize"></div>
    <div id="tabs" class="tabs"></div>
  </aside>

  <main class="workspace">
    <div class="toolbar">
      <span id="plotTitle" class="plot-title"></span>
    </div>
    <div id="plotContainer" class="tab-container"></div>
  </main>
</div>

<script>
const vscode = acquireVsCodeApi();

const items = [];
let activeId = null;

const sidebarEl = document.getElementById("sidebar");
const sidebarResizerEl = document.getElementById("sidebarResizer");
const tabsEl = document.getElementById("tabs");
const plotTitleEl = document.getElementById("plotTitle");
const plotContainerEl = document.getElementById("plotContainer");

const pending = new Map();

window.addEventListener('message', event => {
  const message = event.data;
  switch (message.type) {
    case 'addTab':
      createTab(message.symbol);
      break;
    case 'getTags:response':
      const resolve = pending.get(message.id);
      if (resolve) {
        pending.delete(message.id);
        resolve(message.data);
      }
      break;
  }
});

function getTags(tagName) {
  return new Promise(resolve => {
    const id = Math.random().toString(36);
    pending.set(id, resolve);
    vscode.postMessage({
      type: 'getTags',
      id,
      tagName
    });
  });
}

window.postFileData = function (tagData) {
  vscode.postMessage({
    type: 'postFileInfo',
    data: tagData
  });
};

function createTab(symbolName) {
  const item = {
    id: crypto.randomUUID(),
    name: symbolName
  };

  const container = document.createElement('div');
  container.style.width = '100%';
  container.style.height = '100%';
  container.style.display = 'block'; // Ensure it has dimensions when Markmap is created
  container.id = `container-${item.id}`;
  
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.id = `mindmap-${item.id}`;
  svg.style.width = '100%';
  svg.style.height = '100%';
  container.appendChild(svg);
  
  plotContainerEl.appendChild(container);
  
  // Make sure it's the active tab so it displays properly
  items.push(item);
  selectItem(item.id);

  // Now create the mindmap while container is visible
  item.container = container;
  item.mm = window.markmap.Markmap.create(
    `svg#mindmap-${item.id}`,
    window.getTags,
    window.postFileData,
    item.name
  );
}

function selectItem(id) {
  activeId = id;
  renderTabs();
  renderContent();
}

function closeItem(id) {
  const index = items.findIndex(p => p.id === id);
  if (index === -1) return;

  const item = items[index];
  if (item.mm && typeof item.mm.destroy === 'function') {
    item.mm.destroy();
  }
  if (item.container && item.container.parentNode) {
    item.container.parentNode.removeChild(item.container);
  }

  items.splice(index, 1);

  if (items.length === 0) {
    activeId = null;
    plotTitleEl.textContent = "";
    plotContainerEl.innerHTML = "<div class='empty-state'>Select a symbol to view callers</div>";
    renderTabs();
    return;
  }

  if (activeId === id) {
    const nextIndex = Math.min(index, items.length - 1);
    activeId = items[nextIndex].id;
  }

  renderTabs();
  renderContent();
}

function renderTabs() {
  tabsEl.innerHTML = "";

  for (const item of items) {
    const tab = document.createElement("div");
    tab.className = "tab" + (item.id === activeId ? " active" : "");
    tab.title = item.name;

    const label = document.createElement("span");
    label.className = "tab-label";
    label.textContent = item.name;

    const close = document.createElement("button");
    close.className = "close-tab";
    close.type = "button";
    close.title = "Close tab";
    close.textContent = "×";

    close.addEventListener("click", event => {
      event.stopPropagation();
      closeItem(item.id);
    });

    tab.appendChild(label);
    tab.appendChild(close);
    tab.addEventListener("click", () => selectItem(item.id));
    tabsEl.appendChild(tab);
  }
}

function renderContent() {
  const activeItem = items.find(p => p.id === activeId);
  
  if (!activeItem) {
    plotTitleEl.textContent = "";
    document.querySelectorAll('.empty-state').forEach(el => el.style.display = 'flex');
    return;
  }

  const emptyStateEl = plotContainerEl.querySelector('.empty-state');
  if (emptyStateEl) emptyStateEl.style.display = 'none';
  
  plotTitleEl.textContent = activeItem.name;

  for (const item of items) {
    if (item.container) {
      item.container.style.display = item.id === activeId ? "block" : "none";
    }
  }
}

function getContentMaxWidth() {
  const labels = [...tabsEl.querySelectorAll(".tab-label")];

  if (labels.length === 0) {
    return 180;
  }

  const widest = Math.max(
    ...labels.map(label => {
      const clone = label.cloneNode(true);
      clone.style.position = "absolute";
      clone.style.visibility = "hidden";
      clone.style.width = "max-content";
      clone.style.maxWidth = "none";
      document.body.appendChild(clone);
      const width = clone.getBoundingClientRect().width;
      clone.remove();
      return width;
    })
  );

  return Math.max(180, Math.ceil(widest + 52));
}

let resizing = false;

sidebarResizerEl.addEventListener("pointerdown", event => {
  resizing = true;
  sidebarResizerEl.classList.add("dragging");
  sidebarResizerEl.setPointerCapture(event.pointerId);
  document.body.style.cursor = "col-resize";
  document.body.style.userSelect = "none";
});

sidebarResizerEl.addEventListener("pointermove", event => {
  if (!resizing) return;

  const maxWidth = getContentMaxWidth();
  const newWidth = Math.max(80, Math.min(maxWidth, event.clientX));
  sidebarEl.style.width = `${newWidth}px`;
});

sidebarResizerEl.addEventListener("pointerup", event => {
  resizing = false;
  sidebarResizerEl.classList.remove("dragging");
  document.body.style.cursor = "";
  document.body.style.userSelect = "";
  sidebarResizerEl.releasePointerCapture(event.pointerId);
});

sidebarResizerEl.addEventListener("pointercancel", () => {
  resizing = false;
  sidebarResizerEl.classList.remove("dragging");
  document.body.style.cursor = "";
  document.body.style.userSelect = "";
});

// Initialize empty state
plotContainerEl.innerHTML = "<div class='empty-state'>Select a symbol to view callers</div>";

</script>
</body>
</html>
